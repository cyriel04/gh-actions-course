name: "04 - Using Actions"

on:
    workflow_dispatch:

jobs:
    buildbuild:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: 04-using-actions/react-app
        steps:
            - name: "Checkout Code"
              uses: actions/checkout@v4
            - run: echo "Checkout - Runner OS $RUNNER_OS"

            - name: "Print directory contents"
              run: |
                  echo "Print - Runner OS $RUNNER_OS"
                  ls

            - name: "Setup Node"
              uses: actions/setup-node@v3
              with:
                  node-version: "20"
            - run: |
                  echo "Running Setup Node.js script..."

            - name: "Install Dependencies"
              run: |
                  npm ci
                  echo "Running Node.js script..."

            - name: "Run Unit tests"
              run: |
                  npm run test
                  echo "Running Test script..."
