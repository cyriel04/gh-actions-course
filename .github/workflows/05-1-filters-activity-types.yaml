name: "05 - 1 - Event Filters and Activity Types"

on:
    pull_request:
        types: [opened, synchronize]
        branches:
            - main

jobs:
    echo:
        runs-on: ubuntu-latest
        steps:
            - name: Echo Event Filters and Activity Types
              run: |
                echo "Running whenever a PR is opened or synchronized AND base branch is main:"
                echo "${{ toJson(github.event.pull_request.event_filters) }}"
                echo "Activity Types:"
                echo "${{ toJson(github.event.pull_request.activity_types) }}"
