name: "01 - Building Blocks"
on:
    workflow_dispatch:
jobs:
    first_job:
        runs-on: ubuntu-latest
        steps:
            - name: "Say hello"
              uses: actions/setup-node@v3
              with:
                  node-version: "16"
            - run: echo "Hello, World!"

    second_job:
        runs-on: ubuntu-latest
        steps:
            - name: "Successful step"
              uses: actions/setup-node@v3
              with:
                  node-version: "16"
            - run: |
                  echo "I will succeed"
                  exit 0

            - name: "Say goodbye"
              uses: actions/setup-node@v3
              with:
                  node-version: "16"
            - run: echo "Sayonara, World!"
