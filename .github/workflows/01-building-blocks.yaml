name: "01-building-blocks"
on: push
jobs:
    first_job:
        runs-on: ubuntu-latest
        steps:
            - name: "Say hello"
              uses: actions/setup-node@v3
              with:
                  node-version: "16"
            - run: echo "Hello, World!"

    second_job:
        runs-on: ubuntu-latest
        steps:
            - name: "Failed step"
              uses: actions/setup-node@v3
              with:
                  node-version: "16"
            - run: |
                  echo "I will fail"
                  exit 1

            - name: "Say goodbye"
              uses: actions/setup-node@v3
              with:
                  node-version: "16"
            - run: echo "Sayonara, World!"
