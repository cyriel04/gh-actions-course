name: "01-building-blocks"
description: "A workflow to demonstrate building blocks in a YAML format."
on: push
jobs:
    first_job:
        runs-on: ubuntu-latest
        steps:
            - name: "Say hello"
            - run: echo "Hello, World!"
    second_job:
        runs-on: ubuntu-latest
        steps:
            - name: "Failed step"
            - run: |
                  echo "I will fail"
                  exit 1
            - name: "Say goodbye"
            - run: echo "Sayonara, World!"
